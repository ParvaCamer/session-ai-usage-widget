name: Release

# Pour publier une version : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Le widget compare son numéro de version à celui du dernier tag : ils doivent correspondre,
  # sinon la flèche « mise à jour disponible » ne disparaîtrait jamais.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que le tag correspond à la version du code
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version = \"$TAG\"" windows/ClaudeUsage.cs || { echo "Mettre Updates.Version = \"$TAG\" dans windows/ClaudeUsage.cs"; exit 1; }
          grep -q "version = \"$TAG\"" mac/main.swift || { echo "Mettre Updates.version = \"$TAG\" dans mac/main.swift"; exit 1; }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        shell: cmd
        run: windows\build.bat
      - name: Assembler le zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory ClaudeUsage | Out-Null
          Copy-Item windows\ClaudeUsage.exe, windows\*.dll, windows\WebView2-*.txt, LICENSE -Destination ClaudeUsage
          Compress-Archive -Path ClaudeUsage -DestinationPath ClaudeUsage-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ClaudeUsage-Windows.zip

  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler pour Apple Silicon et Intel
        run: UNIVERSAL=1 bash mac/build.sh
      - name: Créer le dmg
        run: |
          mkdir dmg
          cp -R "mac/Claude Usage.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Claude Usage" -srcfolder dmg -ov -format UDZO ClaudeUsage-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ClaudeUsage-macOS.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ClaudeUsage-Windows.zip ClaudeUsage-macOS.dmg \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Installation : voir le README. Les fichiers ne sont pas signés : Windows et macOS affichent un avertissement au premier lancement, le README explique comment passer outre."
